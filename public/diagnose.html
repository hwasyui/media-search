<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Search · Diagnosa koneksi</title>
<style>
  body{margin:0;padding:20px;background:#0b0d10;color:#e6e9ed;font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h1{font-size:18px;margin:0 0 4px} p{color:#8a93a0;margin:0 0 16px}
  table{border-collapse:collapse;width:100%;max-width:760px} td,th{border:1px solid #232932;padding:8px 10px;text-align:left;vertical-align:top;font-size:13px}
  th{background:#0f1318;color:#8a93a0;font-weight:600}
  .ok{color:#2fbf71;font-weight:700} .bad{color:#ef5b5b;font-weight:700} .mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
  a{color:#4c8dff}
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%234c8dff%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27%3EM%3C/text%3E%3C/svg%3E">
</head>
<body>
<h1>Diagnosa koneksi Media Search</h1>
<p>Halaman ini memeriksa apakah browser ini bisa mengambil data dari server. Kirim tangkapan layar seluruh halaman ini ke pemilik server.</p>
<table id="t"><tr><th>Pemeriksaan</th><th>Hasil</th></tr></table>
<p style="margin-top:14px"><a href="/portal.html">Buka portal</a></p>
<script>
const rows = [];
const add = (name, ok, detail) => { rows.push('<tr><td>' + name + '</td><td><span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'OK' : 'GAGAL') + '</span> <span class="mono">' + (detail || '') + '</span></td></tr>'); document.getElementById('t').innerHTML = '<tr><th>Pemeriksaan</th><th>Hasil</th></tr>' + rows.join(''); };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

add('Alamat yang dibuka', true, esc(location.href));
add('Browser', true, esc(navigator.userAgent));

// fitur JavaScript yang dipakai halaman utama
const feats = {
  'optional chaining ?.': () => new Function('a', 'return a?.b')({ b: 1 }) === 1,
  'nullish ??': () => new Function('return null ?? 1')() === 1,
  'Array.at()': () => [1, 2].at(-1) === 2,
  'Object.fromEntries': () => Object.fromEntries([['a', 1]]).a === 1,
  'String.replaceAll': () => 'aa'.replaceAll('a', 'b') === 'bb',
  'regex lookbehind': () => new RegExp('(?<=a)b').test('ab'),
  'fetch + AbortController': () => typeof fetch === 'function' && typeof AbortController === 'function',
};
for (const [k, f] of Object.entries(feats)) { let ok = false, d = ''; try { ok = f(); } catch (e) { d = esc(e.message); } add('Fitur: ' + k, ok, d || (ok ? '' : 'tidak didukung')); }

(async () => {
  for (const p of ['/api/config', '/api/portfolio', '/api/news?limit=1', '/shell.js', '/portal.html']) {
    const t0 = performance.now();
    try {
      const r = await fetch(p, { cache: 'no-store' });
      const txt = await r.text();
      let extra = '';
      if (p.startsWith('/api/')) { try { const j = JSON.parse(txt); extra = Array.isArray(j) ? j.length + ' item' : Object.keys(j).slice(0, 4).join(','); } catch { extra = 'BUKAN JSON: ' + esc(txt.slice(0, 80)); } }
      add('GET ' + p, r.ok, 'HTTP ' + r.status + ' · ' + txt.length + ' byte · ' + Math.round(performance.now() - t0) + ' ms ' + extra);
    } catch (e) { add('GET ' + p, false, esc(e.name + ': ' + e.message)); }
  }
  add('Selesai', true, new Date().toLocaleString('id-ID'));
})();
</script>
</body>
</html>
